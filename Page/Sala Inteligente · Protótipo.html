<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sala Inteligente · Protótipo</title>
<link rel="stylesheet" href="sala-inteligente.css">
<script src="sala-inteligente.js" defer></script>
<script type="module" src="../user_data.js"></script>
</head>
<body>
<p id="auth-status" class="auth-status" role="status" aria-live="polite">Verificando seu acesso...</p>
<button id="auth-gate-logout" class="auth-gate-logout" type="button" hidden>Sair</button>
<div class="app" id="app-content" hidden>
  <aside class="side">
    <div class="logo">Sala <span>Inteligente</span></div>
    <nav id="nav">
      <a href="#painel" data-v="painel">🏠 Introdução</a>
    </nav>
    <button class="btn" id="logout-button" type="button">Sair</button>
  </aside>

  <main>
    <!-- PAINEL -->
    <section class="view" id="painel">
      <h1 id="user-greeting">Bom dia!</h1>
      <p class="sub" id = "texto-introdutorio"></p>
      <form class="create-room-form" id="create-room-form" hidden>
        <label for="room-name">Nome da sala</label>
        <input id="room-name" name="roomName" type="text" placeholder="Ex.: Turma 9A" required>
        <button class="btn" id="create-room-button" type="submit" disabled>Criar sala de aula</button>
      </form>
      <form class="join-room" id="join-room-form" hidden>
        <h2>Entrar em uma sala</h2>
        <label for="student-name">Seu nome</label>
        <input id="student-name" name="studentName" type="text" placeholder="Digite seu nome" required>
        <label for="room-code">Código da sala</label>
        <input id="room-code" name="roomCode" type="text" placeholder="Ex.: ABC123" maxlength="6" required>
        <button class="btn" id="join-room-button" type="submit" disabled>entra na aula</button>
        <p class="join-room-message" id="join-room-message" aria-live="polite"></p>
      </form>
    </section>
  </main>
</div>
</body>
</html>
