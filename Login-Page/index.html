<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel = "stylesheet" href = "style.css">
</head>
<body>
    <div class = "login-container">
        <form  class = "login-form" action="/login" method="post">

            <!-- Titulo que aparece en la página (o Vs Code completou o comentario com en la página... xique) -->
            <h1 class="title">User Login</h1>

            <!-- <label for="username">Email:</label> -->
            <img src="../assets/email-icon.png" alt = "email-icon" class = "email-icon">
            <input class = "write-box" type="email" id="username" name="username" placeholder="Email" required>

            <br><br>

            <!-- <label for="password">Password:</label> -->
            <input class = "write-box" type="password" id="password" name="password" placeholder="Password" required >

            <br><br>

            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
