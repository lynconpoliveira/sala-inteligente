<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel = "stylesheet" href = "style.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
        />

    <script src="scripts.js" defer></script>
</head>
<body>
    <div class = "login-container">
        <form  class = "login-form" action="/login" method="post">

            <!-- Titulo que aparece en la página (o Vs Code completou o comentario com en la página... xique) -->
            <h1 class="title">User Login</h1>

            <!-- <label for="username">Email:</label> -->
            <div class = "write-login-container">
                <img src="../assets/email-icon.png" alt = "email-icon" class = "email-icon">
                <input class = "write-box" type="email" id="username" name="username" placeholder="Write your email" required>
            </div>

            <br><br>

            <!-- <label for="password">Password:</label> -->
             <div class = "write-login-container">
                <img src="../assets/password-icon.png" alt = "password-icon" class = "password-icon">
                <input class = "write-box" type="password" id="password" name="password" placeholder="Write your password" required>
                <i class="fas fa-eye" id="togglePassword"></i>
            </div>

            <br><br>

            <div class = "form-button-login">
                <button type="submit" class="login-button">Login</button>
                <button class="create-acount-button">Create Acount</button>
            </div>
        </form>
    </div>
</body>
</html>
